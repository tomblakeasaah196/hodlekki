---
# cPanel Git Version Control deployment recipe.
#
# The primary deploy path is the webhook (webhook/deploy.php), driven by
# GitHub Actions on push to main. This file only runs when you click
# "Deploy HEAD Commit" in cPanel > Git Version Control > Manage — a
# manual fallback if Actions or the webhook is unavailable.
#
# Both paths call the same script (bin/deploy.sh) so behaviour matches.
deployment:
  tasks:
    - /usr/bin/env bash /home/smartqaq/repositories/hodlekki/bin/deploy.sh
