<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're offline | HOD Lekki</title>
<meta name="theme-color" content="#0B1733">
<link rel="icon" href="/assets/pwa/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon.png">
<!--
    Served by sw.js when a navigation cannot reach the network.

    Everything is inline and self-contained on purpose: this page has to work
    with no network, no CDN and no fonts, and it must contain NO member data —
    it sits in Cache Storage, which outlives sign-out.
-->
<style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: #0B1733;
        color: #E8EDF8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
    }
    .card { max-width: 380px; width: 100%; }
    .tile {
        width: 108px; height: 108px; margin: 0 auto 28px;
        background: #fff; border-radius: 26px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 24px 60px -18px rgba(0,0,0,.65);
    }
    .tile img { width: 82px; height: 82px; }
    .bar { width: 46px; height: 4px; border-radius: 99px; background: #D11920; margin: 0 auto 30px; }
    h1 { font-size: 1.45rem; line-height: 1.25; margin: 0 0 12px; font-weight: 700; letter-spacing: -0.02em; }
    p { margin: 0 0 28px; font-size: .95rem; line-height: 1.65; color: #9FB0CE; }
    button {
        -webkit-appearance: none; appearance: none; border: 0; cursor: pointer;
        font: inherit; font-weight: 700; letter-spacing: .02em;
        background: #D11920; color: #fff;
        padding: 15px 34px; border-radius: 14px; width: 100%;
        box-shadow: 0 12px 30px -10px rgba(209,25,32,.7);
        transition: transform .15s ease, box-shadow .15s ease;
        -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(.97); box-shadow: 0 6px 18px -8px rgba(209,25,32,.7); }
    .hint { margin: 22px 0 0; font-size: .78rem; color: #6B7FA3; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
    <main class="card">
        <div class="tile"><img src="/assets/pwa/icon-192.png" alt="HOD Lekki" width="82" height="82"></div>
        <div class="bar"></div>
        <h1>You're offline</h1>
        <p>
            HOD Lekki needs a connection for this page. Your notifications are still
            being kept for you &mdash; nothing is lost.
        </p>
        <button type="button" onclick="location.reload()">Try again</button>
        <p class="hint">This page will reload itself as soon as you are back online.</p>
    </main>
    <script>
        // Come back on our own as soon as the connection returns.
        addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
