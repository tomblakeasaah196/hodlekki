<?xml version="1.0" encoding="UTF-8"?>
<!-- /assets/se/templates/im_going_square.svg
     "I'm going" share card, 1080 x 1080 — the Square toggle in §14.3.

     Same tokens as im_going.svg, laid out side by side instead of stacked.
     Safe margin is 48 px for squares (§14.4). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Inter, sans-serif">

  <defs>
    <linearGradient id="se-bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop id="se__stop__primary" offset="0" stop-color="#1D356A"/>
      <stop id="se__stop__bg" offset="0.6" stop-color="#0B0D13"/>
      <stop id="se__stop__secondary--2" offset="1" stop-color="#D11920"/>
    </linearGradient>

    <radialGradient id="se-glow-grad" cx="0.5" cy="0.5" r="0.5">
      <stop id="se__stop__glow" offset="0" stop-color="#D11920" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#D11920" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="se-photo-clip">
      <circle cx="800" cy="440" r="190"/>
    </clipPath>
  </defs>

  <rect id="se__fill__bg" x="0" y="0" width="1080" height="1080" fill="#0B0D13"/>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#se-bg-grad)" opacity="0.92"/>
  <circle cx="800" cy="440" r="430" fill="url(#se-glow-grad)" opacity="0.3"/>

  <text id="se__text__organizer" x="48" y="104" font-size="26" font-weight="700" letter-spacing="6"
        fill="#FFFFFF" fill-opacity="0.72">ENVISION</text>
  <rect id="se__box__organizer--fit" x="48" y="78" width="600" height="38"/>

  <text id="se__text__title" x="48" y="214" font-size="84" font-weight="800" font-family="Unbounded, sans-serif"
        fill="#FFFFFF">Chara</text>
  <rect id="se__box__title--fit" x="48" y="148" width="520" height="90"/>

  <text id="se__text__edition" x="48" y="276" font-size="44" font-weight="700" font-family="Unbounded, sans-serif"
        fill="#D11920">2026</text>
  <rect id="se__box__edition--fit" x="48" y="238" width="320" height="50"/>

  <g id="se__if__has_photo">
    <circle id="se__stroke__primary" cx="800" cy="440" r="198" fill="none" stroke="#1D356A" stroke-width="12"/>
    <g clip-path="url(#se-photo-clip)">
      <rect x="610" y="250" width="380" height="380" fill="#151822"/>
      <image id="se__image__photo" x="610" y="250" width="380" height="380"
             preserveAspectRatio="xMidYMid slice" href=""/>
    </g>
    <circle id="se__stroke__accent" cx="800" cy="440" r="190" fill="none" stroke="#F5C518" stroke-width="4" stroke-opacity="0.6"/>
  </g>

  <g id="se__ifnot__has_photo">
    <circle id="se__fill__surface" cx="800" cy="440" r="190" fill="#151822" fill-opacity="0.5"/>
    <circle id="se__stroke__accent--2" cx="800" cy="440" r="190" fill="none" stroke="#F5C518" stroke-width="4" stroke-opacity="0.4"/>
    <text x="800" y="490" font-size="140" text-anchor="middle">🎉</text>
  </g>

  <text id="se__text__headline" x="48" y="470" font-size="84" font-weight="800" font-family="Unbounded, sans-serif"
        fill="#FFFFFF">I&#8217;m going!</text>
  <rect id="se__box__headline--fit" x="48" y="396" width="540" height="92"/>

  <text id="se__text__first_name" x="48" y="546" font-size="48" font-weight="700" fill="#F5C518">Ada</text>
  <rect id="se__box__first_name--fit" x="48" y="500" width="540" height="58"/>

  <rect id="se__fill__surface--2" x="48" y="640" width="760" height="212" rx="32" fill="#151822" fill-opacity="0.72"/>

  <text id="se__text__date" x="88" y="716" font-size="40" font-weight="700" fill="#FFFFFF">Sat 24 Oct</text>
  <rect id="se__box__date--fit" x="88" y="680" width="420" height="50"/>

  <text id="se__text__time" x="88" y="778" font-size="36" font-weight="500" fill="#FFFFFF" fill-opacity="0.82">5:00 PM</text>
  <rect id="se__box__time--fit" x="88" y="744" width="420" height="46"/>

  <text id="se__text__venue" x="88" y="832" font-size="30" font-weight="500" fill="#FFFFFF" fill-opacity="0.72">HOD Lekki Centre</text>
  <rect id="se__box__venue--wrap-1" x="88" y="802" width="420" height="40"/>

  <rect id="se__qr__ref_url" x="856" y="672" width="152" height="152"/>

  <text id="se__text__url" x="48" y="950" font-size="34" font-weight="700" fill="#FFFFFF">hodlc.lpc.cm/e/chara</text>
  <rect id="se__box__url--fit" x="48" y="912" width="700" height="48"/>

  <text id="se__text__signature" x="48" y="1004" font-size="26" font-weight="500" fill="#FFFFFF" fill-opacity="0.62">Chara 2026 by Envision</text>
  <rect id="se__box__signature--fit" x="48" y="970" width="700" height="40"/>

  <rect id="se__fill__secondary" x="48" y="1036" width="180" height="8" rx="4" fill="#D11920"/>
</svg>
