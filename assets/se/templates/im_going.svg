<?xml version="1.0" encoding="UTF-8"?>
<!-- /assets/se/templates/im_going.svg
     "I'm going" share card, 1080 x 1920 (guide §14.3).

     Token ids follow §14.4 and are resolved on the guest's phone by
     @se/core/svg.js. The two layouts live in se__if__has_photo and
     se__ifnot__has_photo: exactly one survives rendering, so the card never
     shows an empty circle. Safe margin is 64 px.

     Live text only, no <foreignObject>, no script, no external references. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="Inter, sans-serif">

  <defs>
    <linearGradient id="se-bg-grad" x1="0" y1="0" x2="0.4" y2="1">
      <stop id="se__stop__primary" offset="0" stop-color="#1D356A"/>
      <stop id="se__stop__bg" offset="0.55" stop-color="#0B0D13"/>
      <stop id="se__stop__secondary--2" offset="1" stop-color="#D11920"/>
    </linearGradient>

    <radialGradient id="se-glow-grad" cx="0.5" cy="0.5" r="0.5">
      <stop id="se__stop__glow" offset="0" stop-color="#D11920" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#D11920" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="se-photo-clip">
      <circle cx="540" cy="700" r="250"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect id="se__fill__bg" x="0" y="0" width="1080" height="1920" fill="#0B0D13"/>
  <rect x="0" y="0" width="1080" height="1920" fill="url(#se-bg-grad)" opacity="0.92"/>
  <circle cx="540" cy="720" r="620" fill="url(#se-glow-grad)" opacity="0.35"/>

  <!-- Kicker -->
  <text id="se__text__organizer" x="64" y="140" font-size="30" font-weight="700" letter-spacing="7"
        fill="#FFFFFF" fill-opacity="0.72">ENVISION</text>
  <rect id="se__box__organizer--fit" x="64" y="110" width="952" height="44"/>

  <!-- Event wordmark -->
  <text id="se__text__title" x="64" y="268" font-size="104" font-weight="800" font-family="Unbounded, sans-serif"
        fill="#FFFFFF">Chara</text>
  <rect id="se__box__title--fit" x="64" y="186" width="700" height="112"/>

  <text id="se__text__edition" x="64" y="344" font-size="56" font-weight="700" font-family="Unbounded, sans-serif"
        fill="#D11920">2026</text>
  <rect id="se__box__edition--fit" x="64" y="298" width="420" height="62"/>

  <!-- Photo layout -->
  <g id="se__if__has_photo">
    <circle cx="540" cy="700" r="286" fill="url(#se-glow-grad)" opacity="0.8"/>
    <circle id="se__stroke__primary" cx="540" cy="700" r="258" fill="none" stroke="#1D356A" stroke-width="14"/>
    <g clip-path="url(#se-photo-clip)">
      <rect x="290" y="450" width="500" height="500" fill="#151822"/>
      <image id="se__image__photo" x="290" y="450" width="500" height="500"
             preserveAspectRatio="xMidYMid slice" href=""/>
    </g>
    <circle id="se__stroke__accent" cx="540" cy="700" r="250" fill="none" stroke="#F5C518" stroke-width="4" stroke-opacity="0.65"/>
  </g>

  <!-- Photo-less layout: the headline carries the card instead -->
  <g id="se__ifnot__has_photo">
    <circle id="se__fill__surface" cx="540" cy="700" r="250" fill="#151822" fill-opacity="0.55"/>
    <circle id="se__stroke__accent--2" cx="540" cy="700" r="250" fill="none" stroke="#F5C518" stroke-width="4" stroke-opacity="0.45"/>
    <text x="540" y="672" font-size="150" text-anchor="middle">🎉</text>
    <text id="se__text__cta" x="540" y="800" font-size="40" font-weight="700" text-anchor="middle"
          fill="#FFFFFF" fill-opacity="0.78">Come with me</text>
  </g>

  <!-- Headline -->
  <text id="se__text__headline" x="540" y="1092" font-size="118" font-weight="800" font-family="Unbounded, sans-serif"
        text-anchor="middle" fill="#FFFFFF">I&#8217;m going!</text>
  <rect id="se__box__headline--fit" x="64" y="1000" width="952" height="126"/>

  <text id="se__text__first_name" x="540" y="1188" font-size="62" font-weight="700" text-anchor="middle"
        fill="#F5C518">Ada</text>
  <rect id="se__box__first_name--fit" x="64" y="1130" width="952" height="72"/>

  <!-- Details -->
  <rect id="se__fill__surface--2" x="64" y="1264" width="952" height="256" rx="40" fill="#151822" fill-opacity="0.72"/>

  <text id="se__text__date" x="112" y="1350" font-size="44" font-weight="700" fill="#FFFFFF">Sat 24 Oct</text>
  <rect id="se__box__date--fit" x="112" y="1310" width="420" height="56"/>

  <text id="se__text__time" x="112" y="1420" font-size="40" font-weight="500" fill="#FFFFFF" fill-opacity="0.82">5:00 PM</text>
  <rect id="se__box__time--fit" x="112" y="1382" width="420" height="52"/>

  <text id="se__text__venue" x="112" y="1484" font-size="34" font-weight="500" fill="#FFFFFF" fill-opacity="0.72">HOD Lekki Centre</text>
  <rect id="se__box__venue--wrap-1" x="112" y="1450" width="560" height="46"/>

  <!-- QR to the guest's own referral link -->
  <rect id="se__qr__ref_url" x="712" y="1296" width="192" height="192"/>
  <text x="808" y="1520" font-size="24" font-weight="600" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.6">Scan to join me</text>

  <!-- Footer -->
  <text id="se__text__url" x="540" y="1664" font-size="38" font-weight="700" text-anchor="middle" fill="#FFFFFF">hodlc.lpc.cm/e/chara</text>
  <rect id="se__box__url--fit" x="64" y="1620" width="952" height="52"/>

  <text id="se__text__signature" x="540" y="1740" font-size="30" font-weight="500" text-anchor="middle"
        fill="#FFFFFF" fill-opacity="0.62">Chara 2026 by Envision</text>
  <rect id="se__box__signature--fit" x="64" y="1702" width="952" height="44"/>

  <rect id="se__fill__secondary" x="440" y="1832" width="200" height="8" rx="4" fill="#D11920"/>
</svg>
