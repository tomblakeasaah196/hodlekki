<?xml version="1.0" encoding="UTF-8"?>
<!-- /assets/se/templates/im_going.svg
     "I'm going" share card — the Jubilee medallion, 1080 x 1920 (§14.3).

     Token ids follow §14.4 and are resolved on the guest's phone by
     @se/core/svg.js; the guest's photo never leaves the device.

     Two conventions this artwork adds:
     · se__slot__photo is an inert marker — the engine ignores an unknown
       se__ token — that tells the builder where the circle is, so the
       in-ring cropper sits exactly over it. Read by portal/card.js.
     · Z-order is the composition: header, wordmark, medallion, and the
       ribbon LAST so it pins across the medallion's crown.

     Type: fraunces for the display lines and the verse, inter for details.
     Safe margin 64 px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="Inter, sans-serif">

  <defs>
    <clipPath id="se-photo-clip"><circle cx="540" cy="880" r="240"/></clipPath>
    <clipPath id="se-frame"><rect x="0" y="0" width="1080" height="1920"/></clipPath>

    <filter id="se-blur-hero" x="-6%" y="-6%" width="112%" height="112%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="se-blur-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <linearGradient id="se-veil" x1="0" y1="0" x2="0" y2="1">
      <stop id="se__stop__bg" offset="0" stop-color="#0B0D13" stop-opacity="0.86"/>
      <stop id="se__stop__bg--2" offset="0.20" stop-color="#0B0D13" stop-opacity="0.54"/>
      <stop id="se__stop__bg--3" offset="0.50" stop-color="#0B0D13" stop-opacity="0.64"/>
      <stop id="se__stop__bg--4" offset="1" stop-color="#0B0D13" stop-opacity="1"/>
    </linearGradient>

    <radialGradient id="se-core" cx="0.5" cy="0.44" r="0.56">
      <stop id="se__stop__bg--5" offset="0" stop-color="#0B0D13" stop-opacity="0.52"/>
      <stop id="se__stop__bg--6" offset="0.6" stop-color="#0B0D13" stop-opacity="0.18"/>
      <stop id="se__stop__bg--7" offset="1" stop-color="#0B0D13" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="se-bloom" cx="0.5" cy="0.5" r="0.5">
      <stop id="se__stop__primary" offset="0" stop-color="#1D356A" stop-opacity="0.62"/>
      <stop id="se__stop__primary--2" offset="1" stop-color="#1D356A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="se-halo" cx="0.5" cy="0.5" r="0.5">
      <stop id="se__stop__accent" offset="0.60" stop-color="#F5C518" stop-opacity="0.24"/>
      <stop id="se__stop__glow" offset="0.85" stop-color="#D11920" stop-opacity="0.12"/>
      <stop id="se__stop__glow--2" offset="1" stop-color="#D11920" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1 · the night -->
  <rect id="se__fill__bg" x="0" y="0" width="1080" height="1920" fill="#0B0D13"/>

  <!-- 2 · the event's hero photograph, turned to atmosphere.
         The builder replaces it with a 96px thumbnail as a data URI (§3.3). -->
  <g clip-path="url(#se-frame)">
    <g filter="url(#se-blur-hero)">
      <image id="se__image__hero" x="-360" y="60" width="1800" height="1012"
             preserveAspectRatio="xMidYMid slice" href=""/>
    </g>
    <rect x="0" y="0" width="1080" height="1920" fill="#0B0D13" fill-opacity="0.26"/>
    <rect id="se__fill__primary" x="0" y="0" width="1080" height="1920" fill="#1D356A" fill-opacity="0.30"/>
    <rect x="0" y="0" width="1080" height="1920" fill="url(#se-veil)"/>
  </g>

  <!-- 3 · light behind the medallion -->
  <circle cx="540" cy="880" r="620" fill="url(#se-bloom)"/>
  <circle cx="540" cy="880" r="450" fill="url(#se-halo)"/>
  <ellipse cx="540" cy="960" rx="780" ry="720" fill="url(#se-core)"/>

  <!-- 4 · sunburst: twelve rays from behind the medallion -->
  <g stroke="#F5C518" stroke-opacity="0.14" stroke-width="3.5" stroke-linecap="round">
    <line x1="840" y1="880" x2="1180" y2="880"/>
    <line x1="800" y1="1030" x2="1094" y2="1200"/>
    <line x1="690" y1="1140" x2="860" y2="1434"/>
    <line x1="540" y1="1180" x2="540" y2="1520"/>
    <line x1="390" y1="1140" x2="220" y2="1434"/>
    <line x1="280" y1="1030" x2="-14" y2="1200"/>
    <line x1="240" y1="880" x2="-100" y2="880"/>
    <line x1="280" y1="730" x2="-14" y2="560"/>
    <line x1="390" y1="620" x2="220" y2="326"/>
    <line x1="540" y1="580" x2="540" y2="240"/>
    <line x1="800" y1="620" x2="1094" y2="326"/>
    <line x1="840" y1="730" x2="1180" y2="560"/>
  </g>

  <!-- 5 · confetti, scattered above the medallion -->
  <g>
    <rect x="150" y="300" width="16" height="30" rx="3" fill="#F5C518" fill-opacity="0.9" transform="rotate(12 158 315)"/>
    <rect x="232" y="222" width="12" height="44" rx="3" fill="#FFFFFF" fill-opacity="0.75" transform="rotate(-20 238 244)"/>
    <rect x="322" y="352" width="18" height="24" rx="3" fill="#D11920" fill-opacity="0.9" transform="rotate(34 331 364)"/>
    <rect x="412" y="188" width="14" height="38" rx="3" fill="#FFFFFF" fill-opacity="0.6" transform="rotate(-8 419 207)"/>
    <rect x="496" y="310" width="16" height="28" rx="3" fill="#F5C518" fill-opacity="0.9" transform="rotate(52 504 324)"/>
    <rect x="596" y="206" width="12" height="42" rx="3" fill="#FFFFFF" fill-opacity="0.7" transform="rotate(16 602 227)"/>
    <rect x="688" y="352" width="18" height="26" rx="3" fill="#D11920" fill-opacity="0.85" transform="rotate(-34 697 365)"/>
    <rect x="788" y="228" width="14" height="36" rx="3" fill="#FFFFFF" fill-opacity="0.6" transform="rotate(22 795 246)"/>
    <rect x="898" y="318" width="16" height="30" rx="3" fill="#F5C518" fill-opacity="0.9" transform="rotate(-12 906 333)"/>
    <rect x="86" y="440" width="14" height="34" rx="3" fill="#D11920" fill-opacity="0.75" transform="rotate(28 93 457)"/>
    <rect x="972" y="462" width="12" height="36" rx="3" fill="#FFFFFF" fill-opacity="0.55" transform="rotate(-24 978 480)"/>
  </g>

  <!-- 6 · masthead: the crest, then the ministry -->
  <image id="se__image__logo" x="508" y="246" width="64" height="64" href=""/>
  <text id="se__text__organizer" x="540" y="356" font-size="23" font-weight="600" letter-spacing="11"
        text-anchor="middle" fill="#FFFFFF" fill-opacity="0.64">ENVISION PRESENTS</text>
  <rect id="se__box__organizer--fit" x="120" y="320" width="840" height="44" fill="none"/>

  <!-- 7 · scan to join me, opposite the masthead -->
  <rect x="856" y="246" width="128" height="128" rx="16" fill="#FFFFFF"/>
  <rect id="se__qr__ref_url" x="856" y="246" width="128" height="128" rx="16" fill="#000000"/>
  <text x="920" y="408" font-size="18" font-weight="600" letter-spacing="2" text-anchor="middle"
        fill="#FFFFFF" fill-opacity="0.55">SCAN TO JOIN ME</text>

  <!-- 8 · the wordmark -->
  <text id="se__text__title" x="540" y="486" font-size="120" font-weight="900" font-family="Fraunces, Unbounded, serif"
        text-anchor="middle" fill="#FFFFFF">CHARA</text>
  <rect id="se__box__title--fit" x="80" y="374" width="920" height="130" fill="none"/>

  <!-- 9 · the medallion -->
  <circle id="se__stroke__accent" cx="540" cy="880" r="284" fill="none" stroke="#F5C518" stroke-width="4" stroke-opacity="0.45"/>
  <circle id="se__stroke__primary" cx="540" cy="880" r="276" fill="none" stroke="#1D356A" stroke-width="22"/>
  <circle cx="540" cy="880" r="260" fill="none" stroke="#F5C518" stroke-width="9"/>
  <circle cx="540" cy="880" r="248" fill="none" stroke="#FFE9A3" stroke-width="2.5" stroke-opacity="0.5"/>
  <g filter="url(#se-blur-soft)">
    <path d="M 350 700 A 266 266 0 0 1 480 618" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"
          stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 10 · the guest, or the invitation to add one -->
  <g id="se__ifnot__has_photo">
    <circle id="se__fill__surface" cx="540" cy="880" r="240" fill="#151822" fill-opacity="0.75"/>
    <circle cx="540" cy="880" r="240" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
    <text x="540" y="878" font-size="132" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.30" font-family="Inter, sans-serif">+</text>
    <text id="se__text__cta" x="540" y="952" font-size="30" font-weight="600" text-anchor="middle"
          fill="#FFFFFF" fill-opacity="0.45">Add photo</text>
  </g>

  <g id="se__if__has_photo">
    <g clip-path="url(#se-photo-clip)">
      <rect x="300" y="640" width="480" height="480" fill="#151822"/>
      <image id="se__image__photo" x="300" y="640" width="480" height="480"
             preserveAspectRatio="xMidYMid slice" href=""/>
    </g>
  </g>
  <rect id="se__slot__photo" x="300" y="640" width="480" height="480" rx="240" fill="none"/>

  <!-- 11 · the ribbon, pinned across the medallion's crown -->
  <g>
    <path id="se__fill__secondary" d="M 318 516 L 762 516 L 794 554 L 762 592 L 318 592 L 286 554 Z" fill="#D11920"/>
    <path d="M 286 554 L 318 516 L 318 592 Z" fill="#8E1015"/>
    <path d="M 794 554 L 762 516 L 762 592 Z" fill="#8E1015"/>
    <path d="M 330 526 L 750 526" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
    <text id="se__text__edition" x="540" y="568" font-size="38" font-weight="700" font-family="Fraunces, Unbounded, serif"
          letter-spacing="10" text-anchor="middle" fill="#FFFFFF">2026</text>
    <rect id="se__box__edition--fit" x="360" y="524" width="360" height="58" fill="none"/>
  </g>

  <!-- 12 · the statement -->
  <text id="se__text__headline" x="540" y="1310" font-size="112" font-weight="900" font-style="italic"
        font-family="Fraunces, Unbounded, serif" text-anchor="middle" fill="#FFFFFF">I&#8217;m going!</text>
  <rect id="se__box__headline--fit" x="120" y="1210" width="840" height="130" fill="none"/>

  <text id="se__text__first_name" x="540" y="1376" font-size="42" font-weight="700" font-family="Fraunces, Unbounded, serif"
        letter-spacing="12" text-anchor="middle" fill="#F5C518">Ada</text>
  <rect id="se__box__first_name--fit" x="160" y="1326" width="760" height="58" fill="none"/>

  <!-- 13 · the ticket tear -->
  <text x="540" y="1416" font-size="17" font-weight="600" letter-spacing="6" text-anchor="middle"
        fill="#FFFFFF" fill-opacity="0.42" font-family="Inter, sans-serif">ADMIT ONE</text>
  <line x1="150" y1="1440" x2="930" y2="1440" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.5"
        stroke-dasharray="14 12"/>
  <circle cx="0" cy="1440" r="26" fill="#0B0D13"/>
  <circle cx="1080" cy="1440" r="26" fill="#0B0D13"/>

  <!-- 14 · the verse -->
  <path d="M 480 1492 c 20 -14 40 -14 60 0 c 20 14 40 14 60 0" fill="none" stroke="#F5C518"
        stroke-opacity="0.75" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="540" cy="1474" r="4" fill="#F5C518" fill-opacity="0.85"/>

  <text id="se__text__verse_text" x="540" y="1540" font-size="27" font-weight="500" font-style="italic"
        font-family="Fraunces, Unbounded, serif" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.86">Thou wilt shew me the path of life: in thy presence
    <tspan x="540" dy="40">is fulness of joy; at thy right hand there are</tspan>
    <tspan x="540" dy="40">pleasures for evermore.</tspan></text>
  <rect id="se__box__verse_text--wrap-3" x="90" y="1496" width="900" height="140" fill="none"/>

  <text id="se__text__verse_ref" x="540" y="1676" font-size="21" font-weight="600" letter-spacing="6"
        text-anchor="middle" fill="#F5C518" fill-opacity="0.9">PSALM 16:11</text>
  <rect id="se__box__verse_ref--fit" x="300" y="1650" width="480" height="38" fill="none"/>

  <!-- 15 · where and when -->
  <text id="se__text__date" x="516" y="1728" font-size="30" font-weight="700" font-family="Fraunces, Unbounded, serif"
        text-anchor="end" fill="#FFFFFF">Sat 24 Oct</text>
  <rect id="se__box__date--fit" x="180" y="1692" width="336" height="46" fill="none"/>
  <circle cx="540" cy="1718" r="4" fill="#FFFFFF" fill-opacity="0.5"/>
  <text id="se__text__time" x="564" y="1728" font-size="30" font-weight="700" font-family="Fraunces, Unbounded, serif"
        text-anchor="start" fill="#FFFFFF">5:00 PM</text>
  <rect id="se__box__time--fit" x="564" y="1692" width="300" height="46" fill="none"/>

  <text id="se__text__venue" x="540" y="1766" font-size="28" font-weight="500" text-anchor="middle"
        fill="#FFFFFF" fill-opacity="0.72">HOD Lekki Centre</text>
  <rect id="se__box__venue--fit" x="120" y="1732" width="840" height="44" fill="none"/>

  <text id="se__text__url" x="540" y="1806" font-size="24" font-weight="500" letter-spacing="2"
        text-anchor="middle" fill="#FFFFFF" fill-opacity="0.5">hodlc.lpc.cm/e/chara</text>
  <rect id="se__box__url--fit" x="120" y="1774" width="840" height="40" fill="none"/>

  <text id="se__text__signature" x="540" y="1850" font-size="19" font-weight="500" letter-spacing="3"
        text-anchor="middle" fill="#FFFFFF" fill-opacity="0.38">Chara 2026 by Envision</text>
  <rect id="se__box__signature--fit" x="120" y="1822" width="840" height="34" fill="none"/>

  <!-- 16 · the crest, almost subliminal -->
  <image id="se__image__logo--2" x="780" y="1690" width="500" height="500" opacity="0.05" href=""/>
</svg>
