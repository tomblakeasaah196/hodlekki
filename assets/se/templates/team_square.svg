<?xml version="1.0" encoding="UTF-8"?>
<!-- /assets/se/templates/team_square.svg
     Team card (square), 1080 x 1080 (guide §14.3).

     Token ids follow §14.4 and are resolved on the guest's phone by
     @se/core/svg.js. Nothing here is fetched at render time: the fonts are
     inlined and the QR is drawn from the data, so the card rasterises on a
     phone with no signal.

     Live text only, no <foreignObject>, no script, no external references. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Inter, sans-serif">

  <defs>
    <linearGradient id="se-bg-grad" x1="0" y1="0" x2="0.4" y2="1">
      <stop id="se__stop__primary" offset="0" stop-color="#1D356A"/>
      <stop id="se__stop__bg" offset="0.55" stop-color="#0B0D13"/>
      <stop id="se__stop__secondary--2" offset="1" stop-color="#D11920"/>
    </linearGradient>
    <radialGradient id="se-glow-grad" cx="0.5" cy="0.5" r="0.5">
      <stop id="se__stop__glow" offset="0" stop-color="#D11920" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#D11920" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect id="se__fill__bg" x="0" y="0" width="1080" height="1080" fill="#0B0D13"/>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#se-bg-grad)" opacity="0.92"/>
  <circle cx="540" cy="460" r="648" fill="url(#se-glow-grad)" opacity="0.32"/>

  <!-- The team colour is the whole point of this card, so it is the frame -->
  <rect id="se__stroke__team" x="28" y="28" width="1024" height="1024" rx="56" fill="none"
        stroke="#D11920" stroke-width="16"/>

  <text id="se__text__organizer" x="540" y="110" font-size="30" font-weight="700" letter-spacing="7"
        text-anchor="middle" fill="#FFFFFF" fill-opacity="0.7">ENVISION</text>
  <rect id="se__box__organizer--fit" x="96" y="78" width="888" height="44"/>

  <text id="se__text__title" x="540" y="215" font-size="68" font-weight="800"
        font-family="Unbounded, sans-serif" text-anchor="middle" fill="#FFFFFF">Chara</text>
  <rect id="se__box__title--fit" x="96" y="139" width="888" height="80"/>

  <text id="se__text__headline" x="540" y="360" font-size="42" font-weight="700"
        letter-spacing="4" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.8">I&#8217;M PLAYING FOR</text>
  <rect id="se__box__headline--fit" x="96" y="312" width="888" height="52"/>

  <text id="se__text__team" x="540" y="480" font-size="96" font-weight="800"
        font-family="Unbounded, sans-serif" text-anchor="middle" fill="#D11920">Team Black</text>
  <rect id="se__box__team--fit" x="64" y="364" width="952" height="112"/>

  <rect id="se__fill__surface" x="96" y="570" width="888" height="300" rx="44"
        fill="#151822" fill-opacity="0.72"/>

  <text x="540" y="650" font-size="26" font-weight="700" letter-spacing="5"
        text-anchor="middle" fill="#FFFFFF" fill-opacity="0.5">CAPTAIN</text>
  <text id="se__text__captain" x="540" y="718" font-size="46" font-weight="700"
        text-anchor="middle" fill="#FFFFFF">Ada O.</text>
  <rect id="se__box__captain--fit" x="144" y="668" width="792" height="68"/>

  <text x="540" y="790" font-size="26" font-weight="700" letter-spacing="5"
        text-anchor="middle" fill="#FFFFFF" fill-opacity="0.5">MY NUMBER</text>
  <text id="se__text__player_no" x="540" y="856" font-size="72" font-weight="800"
        font-family="Unbounded, sans-serif" text-anchor="middle" fill="#F5C518">17</text>
  <rect id="se__box__player_no--fit" x="144" y="772" width="792" height="84"/>

  <text id="se__text__count" x="540" y="930" font-size="32" font-weight="500"
        text-anchor="middle" fill="#FFFFFF" fill-opacity="0.72">12 of us tonight</text>
  <rect id="se__box__count--fit" x="96" y="896" width="888" height="50"/>

  <text id="se__text__url" x="540" y="1000" font-size="28" font-weight="700"
        text-anchor="middle" fill="#FFFFFF">hodlc.lpc.cm/e/chara</text>
  <rect id="se__box__url--fit" x="96" y="970" width="888" height="44"/>

  <text id="se__text__signature" x="540" y="1046" font-size="24" font-weight="500"
        text-anchor="middle" fill="#FFFFFF" fill-opacity="0.55">Chara 2026 by Envision</text>
  <rect id="se__box__signature--fit" x="96" y="1022" width="888" height="36"/>

  <rect id="se__fill__secondary" x="440" y="1060" width="200" height="8" rx="4" fill="#D11920"/>
</svg>
