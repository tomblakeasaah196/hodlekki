<?xml version="1.0" encoding="UTF-8"?>
<!-- /assets/se/templates/welcome_square.svg
     Welcome-verse card (square), 1080 x 1080 (guide §14.3).

     Token ids follow §14.4 and are resolved on the guest's phone by
     @se/core/svg.js. Nothing here is fetched at render time: the fonts are
     inlined and the QR is drawn from the data, so the card rasterises on a
     phone with no signal.

     Live text only, no <foreignObject>, no script, no external references. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Inter, sans-serif">

  <defs>
    <linearGradient id="se-bg-grad" x1="0" y1="0" x2="0.4" y2="1">
      <stop id="se__stop__primary" offset="0" stop-color="#1D356A"/>
      <stop id="se__stop__bg" offset="0.55" stop-color="#0B0D13"/>
      <stop id="se__stop__secondary--2" offset="1" stop-color="#D11920"/>
    </linearGradient>
    <radialGradient id="se-glow-grad" cx="0.5" cy="0.5" r="0.5">
      <stop id="se__stop__glow" offset="0" stop-color="#D11920" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#D11920" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect id="se__fill__bg" x="0" y="0" width="1080" height="1080" fill="#0B0D13"/>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#se-bg-grad)" opacity="0.92"/>
  <circle cx="540" cy="520" r="669" fill="url(#se-glow-grad)" opacity="0.3"/>

  <text id="se__text__organizer" x="540" y="110" font-size="30" font-weight="700" letter-spacing="7"
        text-anchor="middle" fill="#FFFFFF" fill-opacity="0.7">ENVISION</text>
  <rect id="se__box__organizer--fit" x="64" y="78" width="952" height="44"/>

  <text id="se__text__title" x="540" y="220" font-size="72" font-weight="800"
        font-family="Unbounded, sans-serif" text-anchor="middle" fill="#FFFFFF">Chara</text>
  <rect id="se__box__title--fit" x="64" y="140" width="952" height="84"/>

  <text id="se__text__headline" x="540" y="380" font-size="54" font-weight="700"
        text-anchor="middle" fill="#FFFFFF" fill-opacity="0.85">Welcome,</text>
  <rect id="se__box__headline--fit" x="64" y="318" width="952" height="64"/>

  <text id="se__text__first_name" x="540" y="490" font-size="84" font-weight="800"
        font-family="Unbounded, sans-serif" text-anchor="middle" fill="#F5C518">Ada</text>
  <rect id="se__box__first_name--fit" x="64" y="392" width="952" height="96"/>

  <!-- The verse itself, on its own plate so it reads as a gift and not a caption -->
  <rect id="se__fill__surface" x="64" y="570" width="952" height="330" rx="44"
        fill="#151822" fill-opacity="0.72"/>

  <text id="se__text__verse_ref" x="540" y="640" font-size="34" font-weight="700"
        text-anchor="middle" fill="#F5C518">Psalms 16:11</text>
  <rect id="se__box__verse_ref--fit" x="112" y="606" width="856" height="48"/>

  <text id="se__text__verse" x="540" y="710" font-size="36" font-weight="500"
        text-anchor="middle" fill="#FFFFFF">Thou wilt shew me the path of life.</text>
  <rect id="se__box__verse--wrap-3" x="112" y="668" width="856"
        height="150"/>

  <text id="se__text__prayer" x="540" y="830" font-size="28" font-weight="500"
        font-style="italic" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.72">May this be your season, Ada.</text>
  <rect id="se__box__prayer--wrap-2" x="112" y="798" width="856" height="64"/>

  <!-- Team flash: only when teams are running tonight -->
  <g id="se__if__has_team">
    <rect id="se__fill__team" x="280" y="930" width="520" height="72" rx="36"
          fill="#D11920"/>
    <text id="se__text__team" x="540" y="978" font-size="34"
          font-weight="800" text-anchor="middle" fill="#FFFFFF">Team Black</text>
    <rect id="se__box__team--fit" x="300" y="944" width="480"
          height="44"/>
  </g>

  <text id="se__text__url" x="540" y="1000" font-size="28" font-weight="700"
        text-anchor="middle" fill="#FFFFFF">hodlc.lpc.cm/e/chara</text>
  <rect id="se__box__url--fit" x="64" y="970" width="952" height="44"/>

  <text id="se__text__signature" x="540" y="1046" font-size="24" font-weight="500"
        text-anchor="middle" fill="#FFFFFF" fill-opacity="0.55">Chara 2026 by Envision</text>
  <rect id="se__box__signature--fit" x="64" y="1022" width="952" height="36"/>

  <rect id="se__fill__secondary" x="440" y="1060" width="200" height="8" rx="4" fill="#D11920"/>
</svg>
