name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: PHP lint + secret sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reach changes must update the How to Use guide
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if grep -qE '(^modules/reach/|^api/reach_|^reach\.php$)' <<< "$CHANGED" && \
             ! grep -qx 'modules/reach/how_to_use.md' <<< "$CHANGED"; then
            echo "::error::Reach module touched without updating modules/reach/how_to_use.md"
            exit 1
          fi

      - name: Assimilation changes must update the How to Use guide
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if grep -qE '(^modules/assimilation/|^api/assimilation_|^assimilation\.php$)' <<< "$CHANGED" && \
             ! grep -qx 'modules/assimilation/how_to_use.md' <<< "$CHANGED"; then
            echo "::error::Assimilation module touched without updating modules/assimilation/how_to_use.md"
            exit 1
          fi

      - name: Special Events changes must update the How to Use guide
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if grep -qE '(^modules/special_events/|^api/special_events_|^includes/special_events/|^e/|^assets/se/js/)' <<< "$CHANGED" && \
             ! grep -qx 'modules/special_events/how_to_use.md' <<< "$CHANGED"; then
            echo "::error::Special Events module touched without updating modules/special_events/how_to_use.md"
            exit 1
          fi

      - name: Deploy exclusions must hold under tar (.deployignore)
        run: |
          set -euo pipefail

          # bin/deploy.sh copies the repo into the public docroot with
          #   tar cf - --exclude-from="$REPO/.deployignore" -C "$REPO" .
          # Same invocation here, to a temp archive so we can list it. tar
          # silently ignores patterns that start or end with "/", so a single
          # stale rsync-style entry puts .git or tests/ on the public web
          # with no error anywhere (open item O16 in docs/engineering_guide.md).
          tarball=$(mktemp)
          members=$(mktemp)
          trap 'rm -f "$tarball" "$members"' EXIT
          tar cf "$tarball" --exclude-from=.deployignore -C . .
          tar tf "$tarball" > "$members"

          fail=0

          # Nothing in this list may ever reach the docroot.
          for path in .git .github .cpanel.yml .deployignore php.ini \
                      tests docs AGENTS.md DEPLOY.md; do
            if grep -qE "^\./${path//./\\.}(/|\$)" "$members"; then
              echo "::error file=.deployignore::'${path}' would be copied into the public docroot — the .deployignore entry for it does not match under tar (patterns must not start or end with '/'; root-only entries look like './${path}')"
              fail=1
            fi
          done

          # And the copy must still be a real deploy: a pattern that excludes
          # everything would otherwise pass the checks above. webhook/.htaccess
          # proves the root-anchored './.htaccess' entry leaves nested files alone.
          for path in index.php includes/db.php webhook/.htaccess; do
            if ! grep -qxF "./${path}" "$members"; then
              echo "::error file=.deployignore::'${path}' would NOT be copied to the docroot — a .deployignore pattern is too broad"
              fail=1
            fi
          done

          if [ "$fail" -eq 0 ]; then
            echo "OK: $(wc -l < "$members") members would be copied; none of the excluded paths among them."
          fi
          exit $fail

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP syntax check (php -l over the tree)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! out=$(php -l "$f" 2>&1); then
              echo "::error file=$f::${out}"
              fail=1
            fi
          done < <(find . -type f -name '*.php' \
                    ! -path './vendor/*' \
                    ! -path './node_modules/*' \
                    -print0)
          exit $fail

      - name: Special Events CSS must be freshly built
        run: |
          set -euo pipefail

          # assets/se/css/se.css is COMMITTED because the cPanel host has no
          # Node (guide §23.2). This rebuilds it with the pinned Tailwind
          # standalone CLI and fails if the committed file differs — which is
          # what stops a class name reaching production without its utility.
          bash bin/build_se_css.sh --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Special Events JavaScript must parse
        run: |
          set -euo pipefail

          # The Studio, the portal and every crew screen are ES modules that
          # nothing compiles, so a stray backtick in an htm template ships as
          # a blank page (it did: the whole Studio, #39). node --check parses
          # without running; the .mjs copy makes Node read it as a module.
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          fail=0
          while IFS= read -r -d '' f; do
            cp "$f" "$tmp/check.mjs"
            if ! out=$(node --check "$tmp/check.mjs" 2>&1); then
              echo "::error file=$f::$(echo "$out" | grep -m1 -E 'SyntaxError|Error' || echo 'does not parse')"
              fail=1
            fi
          done < <(find assets/se/js -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          exit $fail

      - name: Special Events unit tests
        run: |
          set -euo pipefail
          # Includes function_calls_test.php: every function the module calls
          # must exist (php -l cannot see a call to a function never written).
          php tests/special_events/run.php

          # The glob form, not a bare directory: `node --test <dir>` is not
          # supported on Node 22, which resolves it as a module path.
          node --test "tests/special_events/js/*.test.mjs"

      - name: Secret sweep (block obvious leaks)
        run: |
          set -euo pipefail
          fail=0

          # SMS_VAULT_KEY must be loaded from $_ENV, never defined inline.
          if grep -rnE "define\(\s*['\"]SMS_VAULT_KEY['\"]\s*,\s*['\"][0-9a-fA-F]{16,}" \
                --include='*.php' \
                --exclude-dir=vendor --exclude-dir=node_modules . ; then
            echo "::error::Hardcoded SMS_VAULT_KEY define() found in tree"
            fail=1
          fi

          # DB creds must come from .env, not literal PHP.
          if grep -rnE "(DB_PASS|DB_USER|DB_NAME)\s*=\s*['\"][A-Za-z0-9@_-]{3,}" \
                --include='*.php' \
                --exclude-dir=vendor --exclude-dir=node_modules \
                --exclude='.env.example' . ; then
            echo "::error::Hardcoded DB_* credential found in tree"
            fail=1
          fi

          # Special Events secrets must come from $_ENV, never be inlined.
          if grep -rnE "(SE_HASH_PEPPER|ABLY_API_KEY)['\"]?\s*(=>|=|,)\s*['\"][A-Za-z0-9+/=_-]{16,}" \
                --include='*.php' --include='*.js' --include='*.mjs' \
                --exclude-dir=vendor --exclude-dir=node_modules \
                --exclude='.env.example' . ; then
            echo "::error::Hardcoded SE_HASH_PEPPER or ABLY_API_KEY found in tree"
            fail=1
          fi

          # .env should never appear in commits.
          if git ls-files | grep -E '^\.env$' ; then
            echo "::error::.env is tracked in git"
            fail=1
          fi

          exit $fail

  integration:
    name: Special Events integration (${{ matrix.engine }})
    # The production engine is MySQL 8 or MariaDB (unconfirmed, guide §2.3),
    # and they disagree on real things (MariaDB rejects GROUP BY on a key
    # with other columns selected; MySQL rejects some generated-column FKs),
    # so the migrations and the integration suite run on both.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mysql-8.0
            image: mysql:8.0
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - engine: mariadb-10.11
            image: mariadb:10.11
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pcntl
          coverage: none

      - name: Migrations apply, and apply again (idempotent)
        run: |
          set -euo pipefail
          php tests/special_events/db_setup.php --host=127.0.0.1 --port=3306 --user=root --pass=root --db=se_it --fresh --seed
          php tests/special_events/db_setup.php --host=127.0.0.1 --port=3306 --user=root --pass=root --db=se_it

      - name: Integration tests (real database, concurrent check-ins, a whole game night)
        env:
          SE_TEST_DB_HOST: 127.0.0.1
          SE_TEST_DB_PORT: '3306'
          SE_TEST_DB_USER: root
          SE_TEST_DB_PASS: root
          SE_TEST_DB_NAME: se_it
        run: php tests/special_events/integration/run.php

  deploy:
    name: Deploy via webhook
    needs: [lint, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check secrets are configured
        id: check
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_WEBHOOK_URL:    ${{ vars.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "${DEPLOY_WEBHOOK_SECRET:-}" ] || [ -z "${DEPLOY_WEBHOOK_URL:-}" ]; then
            echo "::warning::DEPLOY_WEBHOOK_SECRET or DEPLOY_WEBHOOK_URL not set; skipping deploy."
            echo "::warning::See DEPLOY.md for the one-time setup steps."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: POST to deploy webhook (streams server output back)
        if: steps.check.outputs.skip == 'false'
        env:
          DEPLOY_WEBHOOK_URL:    ${{ vars.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          # The secret is passed only in the request header, never in the URL
          # or query string, so it can't leak into web-server access logs.
          #
          # Body streams to a temp file (so we can print it right after the
          # request) while curl -w prints ONLY the HTTP code to stdout, which
          # we capture into a variable. This avoids the earlier bug where the
          # 404 body and status code got concatenated ("Page Not Found404").
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT

          http_status=$(curl -sS -X POST \
            --max-time 900 \
            --output "$body_file" \
            --write-out "%{http_code}" \
            -H "X-Deploy-Token: ${DEPLOY_WEBHOOK_SECRET}" \
            -H "User-Agent: github-actions-hodlekki/1.0" \
            "${DEPLOY_WEBHOOK_URL}") || {
              rc=$?
              echo "::error::curl failed with exit code ${rc} — check DEPLOY_WEBHOOK_URL and network reachability"
              exit "$rc"
            }

          echo "----- webhook response body -----"
          cat "$body_file"
          echo ""
          echo "----- webhook returned HTTP ${http_status} -----"

          if [ "${http_status}" != "200" ]; then
            echo "::error::Deploy webhook returned HTTP ${http_status}"
            exit 1
          fi

          # The webhook streams output, so its 200 is sent before the deploy
          # finishes; the real result is only in the final marker line.
          if ! grep -q '^\[webhook\] DEPLOY OK$' "$body_file"; then
            echo "::error::Deploy script failed on the server (no '[webhook] DEPLOY OK' in response)"
            exit 1
          fi
